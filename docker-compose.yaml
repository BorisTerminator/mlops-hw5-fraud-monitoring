x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
  POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass}

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks: [ml-scorer]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    networks: [ml-scorer]
    ports:
      - "9095:9095"  # доступ к брокеру с хоста: localhost:9095
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Одноразовый контейнер: создаёт топики и завершается
  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    networks: [ml-scorer]
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic scoring --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    networks: [ml-scorer]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  postgres:
    image: postgres:15
    networks: [ml-scorer]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Онлайн-скоринг: модель берёт из ./models по latest.txt, новую версию подхватывает без перезапуска
  fraud_detector:
    build: ./fraud_detector
    restart: unless-stopped
    networks: [ml-scorer]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTIONS_TOPIC: transactions
      KAFKA_SCORING_TOPIC: scoring
      MODELS_DIR: /models
      MODEL_THRESHOLD: "0.5"
    volumes:
      - ./models:/models
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  # Бесконечный поток транзакций из train.csv с текущим временем
  transaction_simulator:
    build: ./transaction_simulator
    restart: unless-stopped
    networks: [ml-scorer]
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transactions
      TRANSACTIONS_CSV_PATH: /data/train.csv
      SEND_INTERVAL_SECONDS: "0.1"
    volumes:
      - ${TRAIN_DATA_CSV:-./data/train.csv}:/data/train.csv:ro
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  # Топик scoring -> таблица scores (score, fraud_flag, model_version)
  scoring_writer:
    build: ./scoring_writer
    restart: unless-stopped
    networks: [ml-scorer]
    environment:
      <<: *postgres-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SCORING_TOPIC: scoring
    depends_on:
      postgres:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  # Один раз грузит train.csv в витрину labeled_transactions и создаёт training_state
  data_loader:
    build: ./data_loader
    networks: [ml-scorer]
    environment:
      <<: *postgres-env
      LABELED_CSV_PATH: /data/train.csv
    volumes:
      - ${TRAIN_DATA_CSV:-./data/train.csv}:/data/train.csv:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow:
    build: ./airflow
    user: "0:0"
    networks: [ml-scorer]
    environment:
      <<: *postgres-env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow_state/airflow.db
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      PYTHONPATH: /opt/airflow
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      TRAINING_DATA_DIR: /opt/airflow/training_data
      MODELS_DIR: /opt/airflow/models
      REPORTS_DIR: /opt/airflow/reports
      FRAUD_SRC: /opt/airflow/fraud_src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline:ro
      - ./fraud_detector/src:/opt/airflow/fraud_src:ro
      - ./models:/opt/airflow/models      # тот же каталог, что /models у fraud_detector
      - ./reports:/opt/airflow/reports    # HTML-отчёты DQ рядом с моделями
      - training_data:/opt/airflow/training_data
      - airflow_state:/opt/airflow/airflow_state
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      data_loader:
        condition: service_completed_successfully

networks:
  ml-scorer:
    name: ml-scorer
    driver: bridge

volumes:
  postgres_data:
  training_data:
  airflow_state:
