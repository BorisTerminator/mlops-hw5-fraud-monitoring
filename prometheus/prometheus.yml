global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 1s
scrape_configs:
  - job_name: fraud-scorer
    static_configs:
      - targets: ['fraud_detector:8000']
  - job_name: fraud-writer
    static_configs:
      - targets: ['scoring_writer:8001']
  - job_name: docker-host
    static_configs:
      - targets: ['node_exporter:9100']
