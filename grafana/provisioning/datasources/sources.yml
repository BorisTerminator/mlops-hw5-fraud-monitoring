apiVersion: 1
datasources:
  - name: Fraud Prometheus
    uid: fraud-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s
      httpMethod: POST
  - name: Fraud PostgreSQL
    uid: fraud-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: grafana_reader
